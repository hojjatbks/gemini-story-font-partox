<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پارتاکس استوری</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 15px 0; border: 1px solid #333; }
        button { background: #ff5722; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 5px; }
        button:hover { background: #e64a19; }
        .plan-box { display: flex; justify-content: space-around; margin-top: 15px; }
        .plan { border: 1px solid #ff5722; padding: 15px; border-radius: 8px; width: 28%; }
    </style>
</head>
<body>
    <h1>اپلیکیشن پارتاکس استوری</h1>
    
    <div class="card">
        <h3>پلن‌های اشتراک ویژه</h3>
        <div class="plan-box">
            <div class="plan"><h4>۱ ماهه</h4><p>دسترسی عادی</p></div>
            <div class="plan"><h4>۳ ماهه</h4><p>تخفیف ویژه</p></div>
            <div class="plan"><h4>۶ ماهه</h4><p>به‌صرفه‌ترین</p></div>
        </div>
    </div>

    <div class="card">
        <h3>بوم طراحی (پشتیبانی از SVG و JSON)</h3>
        <div id="canvas-container" style="min-height: 200px; background: #2a2a2a; border-radius: 8px; padding: 10px;">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke="#ff5722" stroke-width="4" fill="#333" />
                <text x="50%" y="55%" text-anchor="middle" fill="#fff" font-size="14">Partox</text>
            </svg>
        </div>
        <br>
        <button onclick="shareToStory()">ارسال مستقیم به استوری</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
